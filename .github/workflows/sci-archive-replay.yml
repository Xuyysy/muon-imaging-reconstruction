name: SCI manual archived replay (no new experiment)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Purpose of this read-only archive replay (not new science)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sci-replay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  replay:
    name: Replay archived 1536 RNG parts and 6144 method rows
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      PYTHONPATH: "sci_method/src"
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Python 3.14 (as archived)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Install pinned numerical dependency
        run: python -m pip install --disable-pip-version-check "numpy==2.4.6"

      - name: Deterministic replay against archived observations (read only)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-artifacts
          timeout 180s python .github/scripts/sci_evidence_gate.py \
            --replay --report ci-artifacts/replay-report.json \
            2>&1 | tee ci-artifacts/replay.log

      - name: Upload replay summary even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sci-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          if-no-files-found: warn
          retention-days: 14
